<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NoDice — Main Menu</title>
  <link rel="stylesheet" href="./css/main_menu.css">
</head>
<body>
  <main id="main-menu" aria-labelledby="menu-title">
    <h1 id="menu-title">NoDice</h1>

    <form id="menu-form" aria-describedby="menu-desc">
      <p id="menu-desc">Configure players then start the game.</p>

      <label for="player-count">Player count</label>
      <input id="player-count" name="player-count" type="number" min="1" max="16" value="4" />

      <div class="controls">
        <button type="button" id="start-game">Start Game</button>
        <button type="button" id="options-btn">Options</button>
      </div>
    </form>

    <section id="options-panel" hidden>
      <h2>Options</h2>
      <p>Placeholder options. Add settings here later.</p>
      <button id="close-options">Close</button>
    </section>
  </main>

  <script>
    // Basic wiring: send player count to game.html via query param.
    const startBtn = document.getElementById('start-game');
    const optionsBtn = document.getElementById('options-btn');
    const closeOptions = document.getElementById('close-options');
    const optionsPanel = document.getElementById('options-panel');
    const playerInput = document.getElementById('player-count');

    startBtn.addEventListener('click', () => {
      let n = parseInt(playerInput.value, 10);
      if (!Number.isFinite(n) || n < 1) n = 1;
      if (n > 16) n = 16;
      // navigate to the game page with players as a query param
      window.location.href = `game.html?players=${n}`;
    });

    optionsBtn.addEventListener('click', () => {
      optionsPanel.hidden = false;
    });

    closeOptions.addEventListener('click', () => {
      optionsPanel.hidden = true;
    });

    // allow Enter to start
    document.getElementById('menu-form').addEventListener('submit', (e) => {
      e.preventDefault();
      startBtn.click();
    });
  </script>
</body>
</html>
