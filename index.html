<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NO•DICE Splash</title>
  <link rel="stylesheet" href="css/menu.css">
  <script src="js/main_menu_music.js" defer></script>
</head>
<body>
  <!-- Fullscreen overlay shown first with Play button -->
  <div id="start-overlay" class="overlay">
    <button id="begin" class="play-btn" aria-label="Play / Begin">Play</button>
  </div>

  <main id="stage" class="stage">
    <!-- Placeholder logo image. Replace with your actual SVG/PNG -->
    <img id="logo" class="logo is-hidden" src="https://placecats.com/1000/1000" alt="NO•DICE Logo">

    <!-- Options area (appears when logo is docked) -->
    <section id="options" class="options" aria-label="Options">
      <button class="btn-sketch">Option A</button>
      <button class="btn-sketch">Option B</button>
      <button class="btn-sketch">Option C</button>
    </section>
  </main>
</body>
</html>
